{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Сервис электронных заявлений{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="{% url 'homepage:index' %}">
        <img src="{% static 'homepage/img/portal.svg' %}" alt="" width="42" height="42">
        <span>Электронные заявления</span>
      </a>
      {% include "includes/navigation.html" %}
    </div>
  </header>
  <main class="container main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">Учебный проект · <span data-current-year>2026</span></div>
  </footer>
  <script src="{% static 'homepage/js/app.js' %}" defer></script>
</body>
</html>
